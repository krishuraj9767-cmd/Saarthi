<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saarthi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Ccircle cx='48' cy='48' r='46' fill='%231f5f8b'/%3E%3Cpath d='M48 18L56 40L78 48L56 56L48 78L40 56L18 48L40 40Z' fill='white'/%3E%3Ccircle cx='48' cy='48' r='5' fill='%23e8505b'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#eef3f6; --panel:#ffffff; --ink:#14232e; --muted:#5d7080;
  --me:#1f5f8b; --me-ink:#ffffff; --ai:#e2ebf1; --accent:#e8505b; --line:#d3dee6;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1a22; --panel:#16252f; --ink:#e6eef3; --muted:#8aa0b0;
    --me:#2f7fb3; --me-ink:#ffffff; --ai:#1f3340; --accent:#ff6b76; --line:#26404f; }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;justify-content:center}
.app{width:100%;max-width:720px;height:100%;display:flex;flex-direction:column;background:var(--panel)}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0;font-weight:700}
header button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;font-size:16px}
.me{align-self:flex-end;background:var(--me);color:var(--me-ink);border-bottom-right-radius:4px}
.ai{align-self:flex-start;background:var(--ai);border-bottom-left-radius:4px}
.empty{margin:auto;text-align:center;max-width:300px;line-height:1.5;display:flex;flex-direction:column;align-items:center;gap:8px;animation:hello .8s ease both}
.empty svg{width:96px;height:96px;margin-bottom:6px}
.empty .hi{font-size:26px;font-weight:700;margin:0}
.empty .who{font-size:16px;margin:0}
.empty .hint{font-size:14px;color:var(--muted);margin:6px 0 0}
@keyframes hello{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.empty{animation:none}}
.bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
.bar input{flex:1;min-width:0;padding:12px 14px;border-radius:24px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px}
.bar input:focus,button:focus-visible{outline:2px solid var(--me);outline-offset:2px}
.send{background:var(--me);color:#fff;border:0;border-radius:24px;padding:12px 16px;font-size:16px;cursor:pointer}
.mic{width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:24px;cursor:pointer;flex:none}
.mic.on{animation:pulse 1.1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,80,91,.6)}100%{box-shadow:0 0 0 18px rgba(232,80,91,0)}}
@media (prefers-reduced-motion: reduce){.mic.on{animation:none;outline:3px solid var(--accent)}}
#warn{display:none;margin:0 16px 8px;padding:10px 12px;border-radius:10px;background:#fff3cd;color:#5c4400;font-size:13px;line-height:1.4}
#status{font-size:13px;color:var(--muted);padding:0 16px 6px;min-height:20px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);width:min(92vw,420px);padding:18px}
dialog label{display:block;font-size:14px;margin:12px 0 4px;color:var(--muted)}
dialog input,dialog select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
dialog a{color:var(--me)}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Saarthi</h1>
    <div>
      <button id="clear">Naya chat</button>
      <button id="open-settings">Settings</button>
    </div>
  </header>

  <div id="log"></div>
  <div id="warn"></div>
  <div id="status"></div>

  <div class="bar">
    <button class="mic" id="mic" aria-label="Bolo">🎤</button>
    <input id="text" placeholder="Kuch bhi poochho..." autocomplete="off">
    <button class="send" id="send">Bhejo</button>
  </div>
</div>

<dialog id="settings">
  <h2 style="margin:0 0 4px;font-size:18px">Settings</h2>
  <label for="key">Gemini API key (free)</label>
  <input id="key" type="password" placeholder="AIza...">
  <div style="font-size:13px;margin-top:6px"><a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Free key yahan se lo</a></div>
  <label for="model">Model</label>
  <input id="model" placeholder="gemini-3.6-flash">
  <label for="lang">Bolne ki language</label>
  <select id="lang">
    <option value="hi-IN">Hindi / Hinglish</option>
    <option value="en-IN">English (India)</option>
    <option value="en-US">English (US)</option>
  </select>
  <label><input type="checkbox" id="speak" style="width:auto;margin-right:6px"> Jawab bolkar sunao</label>
  <div class="row">
    <button id="save" class="send">Save</button>
  </div>
</dialog>

<script>
const synth = window.speechSynthesis || { cancel(){}, speak(){}, getVoices(){ return []; } };
const canSpeak = !!window.speechSynthesis && typeof SpeechSynthesisUtterance !== 'undefined';
const $ = id => document.getElementById(id);
const log = $('log'), statusEl = $('status');
let history = [];
let busy = false;

function load(k, d){ try { return localStorage.getItem(k) ?? d; } catch(e){ return d; } }
function store(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

// Agar key har baar na daalni ho to yahan apni key likh sakte ho (file kisi ko share mat karna)
const BUILT_IN_KEY = '';
const cfg = {
  key: load('key','') || BUILT_IN_KEY,
  model: load('model','gemini-3.6-flash'),
  lang: load('lang','hi-IN'),
  speak: load('speak','1') === '1'
};

function addMsg(text, who){
  const e = $('empty'); if (e) e.remove();
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}
function setStatus(t){ statusEl.textContent = t || ''; }

/* ---------- Welcome screen ---------- */
const LOGO = '<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" aria-label="Saarthi logo" role="img"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f9bd0"/><stop offset="1" stop-color="#1f4f8b"/></linearGradient></defs><circle cx="48" cy="48" r="46" fill="url(#lg)"/><path d="M48 18L56 40L78 48L56 56L48 78L40 56L18 48L40 40Z" fill="#fff"/><circle cx="48" cy="48" r="5" fill="#e8505b"/></svg>';
function greeting(){
  const h = new Date().getHours();
  if (h >= 5 && h < 12) return 'Good morning';
  if (h >= 12 && h < 17) return 'Good afternoon';
  if (h >= 17 && h < 21) return 'Good evening';
  return 'Good night';
}
function renderHero(){
  log.innerHTML = '<div class="empty" id="empty">' + LOGO +
    '<p class="hi">' + greeting() + '!</p>' +
    '<p class="who">Main Saarthi hoon, Krishu ka assistant.</p>' +
    '<p class="hint">Mic dabao aur bolo, ya neeche type karo.</p></div>';
}
renderHero();


/* ---------- Environment check ---------- */
(function(){
  let ok = true;
  try { localStorage.setItem('_t','1'); ok = localStorage.getItem('_t') === '1'; localStorage.removeItem('_t'); } catch(e){ ok = false; }
  const web = location.protocol === 'https:' || location.protocol === 'http:';
  if (!ok || !web) {
    const w = $('warn');
    w.style.display = 'block';
    w.textContent = 'Dhyan do: ye file seedhe phone/PC se khuli hai, isliye key save nahi hoti aur mic block ho sakta hai. Mic aur key ke liye ise https link (hosting) se kholo, ya keyboard ka mic use karo.';
  }
})();

/* ---------- Settings ---------- */
const dlg = $('settings');
function fillSettings(){
  $('key').value = cfg.key; $('model').value = cfg.model;
  $('lang').value = cfg.lang; $('speak').checked = cfg.speak;
}
$('open-settings').onclick = () => { fillSettings(); dlg.showModal(); };
$('save').onclick = () => {
  cfg.key = $('key').value.trim();
  cfg.model = $('model').value.trim() || 'gemini-3.6-flash';
  cfg.lang = $('lang').value;
  cfg.speak = $('speak').checked;
  store('key',cfg.key); store('model',cfg.model); store('lang',cfg.lang); store('speak',cfg.speak?'1':'0');
  if (rec) rec.lang = cfg.lang;
  dlg.close();
};
$('clear').onclick = () => {
  history = []; synth.cancel();
  renderHero();
};
if (!cfg.key) { fillSettings(); setTimeout(() => dlg.showModal(), 300); }

/* ---------- Gemini ---------- */
const SYSTEM = "Tumhara naam Saarthi hai. Tum Krishu ke banaye hue helpful, friendly AI assistant ho. Agar koi puchhe ki tumhara developer ya creator kaun hai, to bolo: 'Main Krishu ka assistant hoon.' Company ya underlying model ka naam mat batao. Agar koi seriously puchhe ki tum insaan ho ya AI, to saaf batao ki tum AI ho. User jis language ya style mein baat kare (Hindi, Hinglish, English), usi mein jawab do. Jawab chhote aur seedhe rakho kyunki use bolkar sunaya jayega; markdown symbols (*, #) mat use karo.";

async function ask(userText){
  history.push({ role:'user', parts:[{ text:userText }] });
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(cfg.model)}:generateContent`;
  const res = await fetch(url, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'x-goog-api-key': cfg.key },
    body: JSON.stringify({
      systemInstruction:{ parts:[{ text:SYSTEM }] },
      contents: history
    })
  });
  const data = await res.json();
  if (!res.ok) {
    history.pop();
    throw new Error(data?.error?.message || ('Error ' + res.status));
  }
  const reply = data?.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || 'Kuch jawab nahi mila.';
  history.push({ role:'model', parts:[{ text:reply }] });
  return reply;
}

async function handle(text){
  text = text.trim();
  if (!text || busy) return;
  if (!cfg.key) { fillSettings(); dlg.showModal(); return; }
  busy = true;
  synth.cancel();
  addMsg(text, 'me');
  setStatus('Soch raha hoon...');
  try {
    const reply = await ask(text);
    addMsg(reply, 'ai');
    setStatus('');
    if (cfg.speak) speak(reply);
  } catch (err) {
    setStatus('');
    addMsg('Problem aayi: ' + err.message, 'ai');
  } finally { busy = false; }
}

/* ---------- Voice out ---------- */
function speak(text){
  if (!canSpeak) { setStatus('Is browser mein bolkar jawab nahi chalta, Chrome mein kholo.'); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = cfg.lang;
  const v = synth.getVoices().find(v => v.lang === cfg.lang) ||
            synth.getVoices().find(v => v.lang.startsWith(cfg.lang.slice(0,2)));
  if (v) u.voice = v;
  synth.speak(u);
}
synth.onvoiceschanged = () => {};

/* ---------- Voice in ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false, lastErr = '';
if (SR) {
  rec = new SR();
  rec.lang = cfg.lang;
  rec.interimResults = true;
  rec.continuous = false;
  let finalText = '';
  rec.onstart = () => { lastErr = ''; listening = true; $('mic').classList.add('on'); setStatus('Sun raha hoon...'); finalText = ''; };
  rec.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalText += t; else interim += t;
    }
    $('text').value = finalText + interim;
  };
  rec.onerror = e => {
    lastErr = e.error;
    const msgs = {
      'not-allowed': 'Mic ki permission block hai. Chrome mein Microphone Allow karo (address bar ke paas settings/lock icon).',
      'service-not-allowed': 'Is browser mein voice input allowed nahi hai. File ko Chrome mein kholo.',
      'no-speech': 'Kuch sunai nahi diya. Mic dabake thoda zor se bolo.',
      'audio-capture': 'Mic nahi mila. Check karo ki koi aur app mic use na kar rahi ho.',
      'network': 'Voice ke liye internet chahiye. Net check karo.',
      'language-not-supported': 'Ye language support nahi hai, Settings mein English try karo.'
    };
    setStatus(msgs[e.error] || ('Mic error: ' + e.error));
  };
  rec.onend = () => {
    listening = false; $('mic').classList.remove('on');
    const t = $('text').value; $('text').value = '';
    if (t.trim()) { handle(t); }
    else if (!lastErr) { setStatus('Kuch sunai nahi diya, dobara try karo.'); }
  };
}
$('mic').onclick = async () => {
  if (!rec) { setStatus('Is browser mein voice input nahi chalta. File ko Chrome mein kholo.'); return; }
  synth.cancel();
  if (listening) { rec.stop(); return; }
  lastErr = '';
  try {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      const st = await navigator.mediaDevices.getUserMedia({ audio: true });
      st.getTracks().forEach(t => t.stop());
    }
  } catch (e) {
    setStatus('Mic ki permission nahi mili. Allow dabao ya browser settings mein Microphone allow karo.');
    return;
  }
  try { rec.lang = cfg.lang; rec.start(); }
  catch (e) { setStatus('Mic start nahi hua, ek baar aur dabao.'); }
};

/* ---------- Chat input ---------- */
$('send').onclick = () => { const t = $('text').value; $('text').value = ''; handle(t); };
$('text').addEventListener('keydown', e => { if (e.key === 'Enter') $('send').click(); });
</script>
</body>
</html>
